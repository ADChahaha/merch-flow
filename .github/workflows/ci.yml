name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Test and package (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: win-x64
            backend: backend/dist/merch-backend/merch-backend.exe
            packaged-backend: desktop/release/win-unpacked/resources/backend/merch-backend.exe
          - os: macos-14
            artifact: mac-arm64
            backend: backend/dist/merch-backend/merch-backend
            packaged-backend: desktop/release/mac-arm64/MerchFlow.app/Contents/Resources/backend/merch-backend
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and pinned packager
        run: python -m pip install -r backend/requirements.txt pyinstaller==6.22.0
      - name: Backend tests (including explicit CP936/CP1252 streams)
        run: python -m pytest -q backend/tests --junitxml=test-results/source.xml
      - name: Frontend tests and production build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Freeze shipping backend
        working-directory: backend
        run: pyinstaller --noconfirm --clean merch-backend.spec
      - name: Test real frozen CLI, ACP pipes, HTTP API and SQLite
        env:
          MERCH_TEST_BACKEND: ${{ github.workspace }}/${{ matrix.backend }}
          PYTHONUTF8: "0"
          PYTHONIOENCODING: cp936
        run: python -m pytest -q backend/tests/test_packaged_encoding.py -k frozen --junitxml=test-results/frozen.xml
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Package Windows installer
        if: runner.os == 'Windows'
        working-directory: desktop
        run: npx electron-builder --win --publish never
      - name: Package macOS installer
        if: runner.os == 'macOS'
        working-directory: desktop
        run: npx electron-builder --mac --publish never
      - name: Verify backend included in Electron package
        env:
          MERCH_TEST_BACKEND: ${{ github.workspace }}/${{ matrix.packaged-backend }}
          PYTHONUTF8: "0"
          PYTHONIOENCODING: cp936
        run: python -m pytest -q backend/tests/test_packaged_encoding.py -k frozen --junitxml=test-results/packaged.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.artifact }}
          path: test-results/*.xml
      - name: Upload verified installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
          if-no-files-found: error
